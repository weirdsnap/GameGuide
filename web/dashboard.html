<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>博客看板 · 访问 / 助手 / 服务器</title>
<style>
    :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --panel-2: #23272f;
        --line: #2e333d;
        --text: #dfe3ea;
        --muted: #8b94a3;
        --accent: #e0a458;
        --good: #6fbf8b;
        --bad: #e0685e;
        --warn: #d9a441;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 24px 20px 60px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-variant-numeric: tabular-nums;
    }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 12px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button {
        font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
        background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
        padding: 5px 11px;
    }
    button:hover:not(:disabled) { color: var(--text); border-color: #47505e; }
    button.on { color: #14161a; background: var(--accent); border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
    .card .k { color: var(--muted); font-size: 11px; letter-spacing: .03em; }
    .card .v { font-size: 22px; margin-top: 2px; font-weight: 600; }
    .card .n { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .v.ok { color: var(--good); } .v.bad { color: var(--bad); } .v.warn { color: var(--warn); }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between;
                    gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text);
                       letter-spacing: .02em; display: flex; align-items: center; gap: 7px; }
    .section-head h2 .dot { width: 7px; height: 7px; border-radius: 50%; }
    .section-head .sub { font-size: 11.5px; text-align: right; }
    .subhead { margin: 18px 0 8px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .03em; }
    svg { width: 100%; height: 220px; display: block; }
    #blog-trend { height: 190px; }
    .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 6px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 7px 8px; border-bottom: 1px solid #22262d; vertical-align: top; }
    tr.row { cursor: pointer; }
    tr.row:hover { background: var(--panel-2); }
    tr.row.open { background: var(--panel-2); }
    button.row-toggle { padding: 2px 8px; font-size: 11px; }
    td.q { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
    .tag.l3 { color: var(--bad); border-color: #5a2f2b; }
    .tag.l1, .tag.l2 { color: var(--warn); border-color: #4d3f22; }
    .tag.err { color: var(--bad); border-color: #5a2f2b; }
    .detail td { background: #16191e; color: var(--muted); font-size: 12px; padding: 10px 14px; }
    .detail pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--text); font: 12px/1.55 inherit; }
    .blog-cols { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
    .blog-col { flex: 1 1 280px; min-width: 0; }
    .blog-col h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
    .empty { color: var(--muted); padding: 20px 0; text-align: center; font-size: 13px; }
</style>
</head>
<body>

<header>
    <div>
        <h1>博客看板</h1>
        <div class="sub" id="meta">加载中…</div>
    </div>
    <div class="controls">
        <button data-days="3">3 天</button>
        <button data-days="7" class="on">7 天</button>
        <button data-days="30">30 天</button>
        <button id="refresh">刷新</button>
    </div>
</header>

<section id="panel-blog">
    <div class="section-head">
        <h2><i class="dot" style="background:#3d5a80"></i>博客访问</h2>
        <span class="sub">GitHub Pages 前端上报 · UV 按天去重 · 不存 IP 与完整 URL</span>
    </div>
    <div class="cards" id="blog-cards" style="margin-bottom:12px"></div>
    <svg id="blog-trend" viewBox="0 0 900 190" preserveAspectRatio="none"></svg>
    <div class="legend">
        <span><i class="dot" style="background:#3d5a80"></i>PV</span>
        <span><i class="dot" style="background:#e0a458"></i>UV</span>
    </div>
    <div class="blog-cols">
        <div class="blog-col">
            <h3>被读最多的文章</h3>
            <table>
                <thead><tr><th>文章</th><th>PV</th><th>UV</th></tr></thead>
                <tbody id="blog-posts"></tbody>
            </table>
        </div>
        <div class="blog-col">
            <h3>来源域名</h3>
            <table>
                <thead><tr><th>来源</th><th>PV</th></tr></thead>
                <tbody id="blog-refs"></tbody>
            </table>
            <div class="sub" id="blog-devices" style="margin-top:8px"></div>
        </div>
    </div>
    <div class="sub" id="blog-meta" style="margin-top:10px"></div>
</section>

<section id="panel-agent">
    <div class="section-head">
        <h2><i class="dot" style="background:#e0a458"></i>GameGuide 助手</h2>
        <span class="sub">data/turns/*.jsonl 逐轮记录 · 预算线 tokens_in p90 ≤ 40k</span>
    </div>
    <div class="cards" id="cards" style="margin-bottom:14px"></div>
    <div class="subhead">每日趋势</div>
    <svg id="trend" viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
    <div class="legend">
        <span><i class="dot" style="background:#3d5a80"></i>每日轮次</span>
        <span><i class="dot" style="background:#e0a458"></i>tokens_in p90</span>
        <span><i class="dot" style="background:#e0685e"></i>点踩</span>
    </div>
    <div class="subhead">轮次明细</div>
    <div class="controls" style="margin-bottom:10px">
        <button data-filter="" class="on">全部</button>
        <button data-filter="bad">有点踩</button>
        <button data-filter="l3">剧透 L3</button>
        <button data-filter="slow">慢轮 ≥30s</button>
    </div>
    <table>
        <thead>
        <tr>
            <th>时间</th><th>游戏</th><th>路由</th><th>耗时</th>
            <th>tokens_in</th><th>历史</th><th>剧透</th><th>问题</th><th></th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有符合条件的轮次</div>
    <div style="margin-top:12px; text-align:center">
        <button id="more" style="display:none">加载更早</button>
    </div>
</section>

<section id="panel-server">
    <div class="section-head">
        <h2><i class="dot" style="background:#6fbf8b"></i>服务器</h2>
        <span class="sub" id="sys-meta"></span>
    </div>
    <div class="cards" id="sys-cards" style="margin-bottom:12px"></div>
    <div class="blog-cols">
        <div class="blog-col">
            <h3>内存（MB）</h3>
            <svg id="sys-mem" preserveAspectRatio="none" style="height:170px"></svg>
            <div class="legend">
                <span><i class="dot" style="background:#6fbf8b"></i>可用内存</span>
                <span><i class="dot" style="background:#e0685e"></i>swap 已用</span>
            </div>
        </div>
        <div class="blog-col">
            <h3>平均负载（2 核）</h3>
            <svg id="sys-load" preserveAspectRatio="none" style="height:170px"></svg>
            <div class="legend">
                <span><i class="dot" style="background:#e0a458"></i>load1</span>
                <span><i class="dot" style="background:#3d5a80"></i>load5</span>
                <span><i class="dot" style="background:#6fbf8b"></i>load15</span>
            </div>
        </div>
    </div>
</section>

<script>
const API = location.protocol === 'file:' ? 'http://localhost:8765/api' : '/api';
const GAME_NAMES = {
    hollow_knight: '空洞骑士', oni: '缺氧', terraria: '泰拉瑞亚',
    silksong: '丝之歌', cyberpunk2077: '赛博朋克2077', mhw: '怪物猎人荒野',
    va11halla: 'VA-11 Hall-A', baldurs_gate3: '博德之门3'
};

const state = { days: 7, filter: '', before: null, beforeId: null, loading: false };

function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
}

function fmtMs(ms) {
    if (!ms) return '—';
    return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
}

function fmtNum(n) {
    n = Number(n || 0);
    if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
}

function card(k, v, note, cls) {
    const box = el('div', 'card');
    box.append(el('div', 'k', k), el('div', 'v' + (cls ? ' ' + cls : ''), v));
    if (note) box.append(el('div', 'n', note));
    return box;
}

async function getJSON(path) {
    // no-store：看板是现算数据，浏览器启发式缓存会把“没刷新”当成“没数据”
    const res = await fetch(API + path, { credentials: 'same-origin', cache: 'no-store' });
    if (!res.ok) throw new Error(path + ' → ' + res.status);
    return res.json();
}

function renderCards(data) {
    const s = data.summary;
    const cards = document.getElementById('cards');
    cards.replaceChildren(
        card('总轮次', s.turns, data.days + ' 天窗口'),
        card('今日', data.today ? data.today.turns : 0,
             data.today ? 'p90 ' + fmtNum(data.today.tokens_in_p90) + ' tokens' : '暂无数据'),
        card('失败率', (s.fail_rate * 100).toFixed(1) + '%',
             s.failed + ' 轮报错', s.fail_rate > 0.05 ? 'bad' : 'ok'),
        card('耗时 p90', s.elapsed_s.p90 + 's', 'max ' + s.elapsed_s.max + 's'),
        card('tokens_in p90', fmtNum(data.budget.p90),
             data.budget.ok ? '预算内（≤ ' + fmtNum(data.budget.limit) + '）'
                            : '超预算 ' + fmtNum(data.budget.over_by),
             data.budget.ok ? 'ok' : 'bad'),
        card('点踩', data.feedback.bad + ' / ' + data.feedback.total,
             '差评率 ' + (data.feedback.bad_rate * 100).toFixed(1) + '%',
             data.feedback.bad_rate > 0.2 ? 'warn' : ''),
        card('今日额度', data.quota.used + ' / ' + data.quota.limit,
             '剩余 ' + data.quota.remaining, data.quota.remaining < 10 ? 'warn' : '')
    );
}

function renderTrend(daily) {
    const svg = document.getElementById('trend');
    svg.replaceChildren();
    const W = Math.max(320, Math.round(svg.clientWidth || 900)), H = 220, padL = 34, padB = 26, padT = 12;
    // 按容器实际宽度画（而不是固定 900 再缩）：窄屏时段字仍是 10px，日期看得见
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    if (!daily.length) {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', W / 2); t.setAttribute('y', H / 2);
        t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#8b94a3');
        t.textContent = '暂无数据';
        svg.append(t);
        return;
    }

    const maxTurns = Math.max(1, ...daily.map(d => d.turns));
    const maxTokens = Math.max(1, ...daily.map(d => d.tokens_in_p90));
    const innerW = W - padL - 10, innerH = H - padT - padB;
    const slot = innerW / daily.length;
    const barW = Math.max(4, Math.min(38, slot * 0.55));

    const mk = (name, attrs) => {
        const node = document.createElementNS('http://www.w3.org/2000/svg', name);
        for (const k in attrs) node.setAttribute(k, attrs[k]);
        return node;
    };

    // 基线
    svg.append(mk('line', { x1: padL, y1: H - padB, x2: W - 10, y2: H - padB,
                            stroke: '#2e333d', 'stroke-width': 1 }));
    const yLabel = mk('text', { x: padL - 6, y: padT + 8, 'text-anchor': 'end',
                                fill: '#8b94a3', 'font-size': 10 });
    yLabel.textContent = maxTurns;
    svg.append(yLabel);

    const points = [];
    // 日期标签抽稀：窗口 <= 8 天每天都标，否则按 ~8 格均分（最后一格必标）
    const labelEvery = Math.max(1, Math.ceil(daily.length / 8));
    daily.forEach((d, i) => {
        const cx = padL + slot * i + slot / 2;
        const h = innerH * (d.turns / maxTurns);
        const rect = mk('rect', {
            x: cx - barW / 2, y: H - padB - h, width: barW, height: Math.max(1, h),
            fill: d.turns ? '#3d5a80' : '#2e333d', rx: 2
        });
        // 悬停看完整数字：图上标签再密也不丢信息
        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        tip.textContent = d.date + '\n' + d.turns + ' 轮 · 失败 ' + d.failed +
            '\np90 耗时 ' + d.elapsed_p90 + 's · tokens ' + fmtNum(d.tokens_in_p90) +
            (d.feedback_bad ? '\n点踩 ' + d.feedback_bad : '');
        rect.append(tip);
        svg.append(rect);
        if (daily.length <= 8 || i % labelEvery === 0 || i === daily.length - 1) {
            const t = mk('text', { x: cx, y: H - 8, 'text-anchor': 'middle',
                                   fill: '#8b94a3', 'font-size': 10 });
            t.textContent = d.date.slice(5);
            svg.append(t);
        }
        const y = H - padB - innerH * (d.tokens_in_p90 / maxTokens);
        points.push([cx, y]);
        if (d.feedback_bad > 0) {
            svg.append(mk('circle', { cx: cx, cy: H - padB - h - 8,
                                      r: Math.min(6, 2 + d.feedback_bad),
                                      fill: '#e0685e', opacity: 0.85 }));
        }
    });

    if (points.length > 1) {
        svg.append(mk('polyline', {
            points: points.map(p => p.join(',')).join(' '),
            fill: 'none', stroke: '#e0a458', 'stroke-width': 1.6
        }));
    }
    const p90Label = mk('text', { x: W - 10, y: padT + 8, 'text-anchor': 'end',
                                  fill: '#e0a458', 'font-size': 10 });
    p90Label.textContent = 'p90 ' + fmtNum(maxTokens);
    svg.append(p90Label);
}

function spoilerTag(level, terms) {
    if (!level) return document.createTextNode('—');
    const tag = el('span', 'tag l' + level, 'L' + level);
    if (terms && terms.length) tag.title = terms.join(' / ');
    return tag;
}

function renderRows(turns, append) {
    const tbody = document.getElementById('rows');
    if (!append) tbody.replaceChildren();
    for (const t of turns) {
        const tr = el('tr', 'row');
        tr.append(
            el('td', '', t.time),
            el('td', '', GAME_NAMES[t.game] || t.game || '—'),
            el('td', '', t.route || '—'),
            el('td', '', fmtMs(t.elapsed_ms)),
            el('td', '', fmtNum(t.tokens_in)),
            el('td', '', String(t.history_msgs)),
            el('td', '')
        );
        tr.lastChild.append(t.error ? el('span', 'tag err', 'error')
                                    : spoilerTag(t.spoiler_level, t.spoiler_terms));
        const q = el('td', 'q', t.question || '');
        q.title = t.question || '';
        tr.append(q);

        // 明细默认收起，按钮是显式入口（点整行也能开，但表格里看不出来能点）
        const btn = el('button', 'row-toggle', '详情');
        btn.type = 'button';
        const btnCell = el('td');
        btnCell.style.whiteSpace = 'nowrap';
        btnCell.append(btn);
        tr.append(btnCell);

        const detail = el('tr', 'detail');
        detail.style.display = 'none';
        const cell = el('td');
        cell.colSpan = 9;
        const head = el('div', '', '回答开头：');
        const pre = el('pre', '', t.answer_head || '（无）');
        const meta = el('div', 'sub');
        meta.style.marginTop = '8px';
        meta.textContent = [
            'turn_id ' + (t.turn_id || '—'),
            'session ' + (t.session_id || '—'),
            'out ' + fmtNum(t.tokens_out),
            'tools ' + t.tool_calls,
            'ip ' + (t.ip || '—'),
            t.progress_level ? '进度 L' + t.progress_level : null,
            t.error ? '错误：' + t.error : null
        ].filter(Boolean).join(' · ');
        cell.append(head, pre, meta);
        detail.append(cell);

        const toggle = () => {
            const open = detail.style.display === 'none';
            detail.style.display = open ? '' : 'none';
            btn.textContent = open ? '收起' : '详情';
            btn.classList.toggle('on', open);
            tr.classList.toggle('open', open);
        };
        btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
        tr.addEventListener('click', toggle);
        tbody.append(tr, detail);
    }
    document.getElementById('empty').style.display =
        tbody.children.length ? 'none' : '';
}

async function loadSummary() {
    const data = await getJSON('/dashboard/summary?days=' + state.days);
    const activeDays = data.daily.filter(d => d.turns > 0).length;
    document.getElementById('meta').textContent =
        data.days + ' 天窗口 · 助手有数据 ' + activeDays + '/' + data.daily.length + ' 天 · 生成于 ' +
        new Date(data.generated_at * 1000).toLocaleTimeString('zh-CN');
    renderCards(data);
    renderTrend(data.daily);
}

async function loadTurns(reset) {
    if (state.loading) return;
    state.loading = true;
    const btn = document.getElementById('more');
    btn.disabled = true;
    try {
        if (reset) { state.before = null; state.beforeId = null; }
        let qs = '/dashboard/turns?days=' + state.days + '&limit=50';
        if (state.filter) qs += '&' + state.filter + '=1';
        if (state.before) qs += '&before=' + state.before + '&before_id=' + encodeURIComponent(state.beforeId || '');
        const data = await getJSON(qs);
        renderRows(data.turns, !reset);
        state.before = data.next_before;
        state.beforeId = data.next_before_id;
        btn.style.display = data.next_before ? '' : 'none';
    } catch (e) {
        document.getElementById('meta').textContent = '加载失败：' + e.message;
    } finally {
        state.loading = false;
        btn.disabled = false;
    }
}

// ====== 系统资源（docs/DASHBOARD_PLAN.md §11）======
// 内存/swap/load/CPU/磁盘/RSS；阈值判断在后端 sysstat.health，前端只染色。
function renderSysCards(now, health) {
    const h = health || {};
    const mb = v => (v === null || v === undefined) ? '—' : fmtNum(v) + 'M';
    const num = (v, suffix) => (v === null || v === undefined) ? '—' : v + (suffix || '');
    document.getElementById('sys-cards').replaceChildren(
        card('load 1min', num(now.load1), '2 核，>2 才真排队', h.load),
        card('CPU', num(now.cpu_pct, '%'), '两次采样的差值'),
        card('可用内存', mb(now.mem_avail_mb), '共 ' + mb(now.mem_total_mb), h.mem),
        card('swap 已用', mb(now.swap_used_mb), '共 ' + mb(now.swap_total_mb), h.swap),
        card('磁盘可用', mb(now.disk_free_mb), '已用 ' + mb(now.disk_used_mb), h.disk),
        card('进程 RSS', mb(now.rss_mb),
            '线程 ' + num(now.threads) + ' · 句柄 ' + num(now.fds))
    );
}

function renderSysChart(svgId, series, lines) {
    const svg = document.getElementById(svgId);
    svg.replaceChildren();
    const H = 170, padL = 40, padB = 22, padT = 10;
    const W = Math.max(280, Math.round(svg.clientWidth || 600));
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const pts = (series || []).filter(s => lines.some(l => typeof s[l.key] === 'number'));
    if (pts.length < 2) {
        svg.append(svgNode('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle',
                                     fill: '#8b94a3', 'font-size': 12 },
                            '攺点中：每 30s 一个点'));
        return;
    }
    const innerH = H - padT - padB;
    const maxV = Math.max(1, ...pts.flatMap(s => lines.map(l => Number(s[l.key]) || 0)));
    const n = pts.length;
    const step = (W - padL - 10) / (n - 1);
    svg.append(svgNode('line', { x1: padL, y1: H - padB, x2: W - 10, y2: H - padB,
                                 stroke: '#2e333d', 'stroke-width': 1 }));
    svg.append(svgNode('text', { x: padL - 6, y: padT + 8, 'text-anchor': 'end',
                                 fill: '#8b94a3', 'font-size': 10 }, fmtNum(Math.round(maxV))));
    for (const l of lines) {
        const coords = [];
        pts.forEach((s, i) => {
            const v = Number(s[l.key]);
            if (Number.isNaN(v)) return;
            coords.push([padL + step * i, H - padB - innerH * (v / maxV)]);
        });
        if (coords.length > 1) {
            svg.append(svgNode('polyline', {
                points: coords.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '),
                fill: 'none', stroke: l.color, 'stroke-width': 1.6
            }));
        }
    }
    // 时间轴：固定抽 5 个标签；跨度超过一天就带日期，否则只有时分
    const span = pts[n - 1].ts - pts[0].ts;
    const withDate = span > 86400;
    const ticks = Math.min(5, n);
    for (let k = 0; k < ticks; k++) {
        const i = Math.round(k * (n - 1) / Math.max(1, ticks - 1));
        const d = new Date(pts[i].ts * 1000);
        const hhmm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        svg.append(svgNode('text', {
            x: padL + step * i, y: H - 6, fill: '#8b94a3', 'font-size': 10,
            'text-anchor': k === 0 ? 'start' : (k === ticks - 1 ? 'end' : 'middle')
        }, withDate ? (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hhmm : hhmm));
    }
}

async function loadSystem() {
    try {
        const hours = Math.min(168, state.days * 24);
        const data = await getJSON('/dashboard/system?hours=' + hours);
        renderSysCards(data.now, data.health);
        renderSysChart('sys-mem', data.series, [
            { key: 'mem_avail_mb', color: '#6fbf8b' },
            { key: 'swap_used_mb', color: '#e0685e' }
        ]);
        renderSysChart('sys-load', data.series, [
            { key: 'load1', color: '#e0a458' },
            { key: 'load5', color: '#3d5a80' },
            { key: 'load15', color: '#6fbf8b' }
        ]);
        document.getElementById('sys-meta').textContent =
            ' 每 ' + data.interval_s + 's 一个采样点 · 窗口 ' + data.hours + 'h · ' +
            (data.points ? data.points + ' 点' : '刚重启，还没攺到点');
    } catch (e) {
        document.getElementById('sys-meta').textContent = ' 加载失败：' + e.message;
    }
}

// ====== 博客访问（docs/BLOG_ANALYTICS_PLAN.md）======
function shortPost(path) {
    let s = String(path || '');
    if (s.startsWith('/post/')) s = s.slice(6);
    if (s.startsWith('posts/')) s = s.slice(6);
    if (s.endsWith('.md')) s = s.slice(0, -3);
    return s;
}

function svgNode(name, attrs, text) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (text !== undefined) node.textContent = text;
    return node;
}

function renderBlogTrend(series) {
    const svg = document.getElementById('blog-trend');
    svg.replaceChildren();
    const H = 190, padL = 34, padB = 24, padT = 12;
    const W = Math.max(300, Math.round(svg.clientWidth || 900));
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    if (!series || !series.length) {
        svg.append(svgNode('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle',
                                     fill: '#8b94a3', 'font-size': 12 }, '暂无数据'));
        return;
    }
    const innerH = H - padT - padB;
    const maxV = Math.max(1, ...series.map(s => Math.max(s.pv, s.uv)));
    const n = series.length;
    const step = n > 1 ? (W - padL - 10) / (n - 1) : 0;
    svg.append(svgNode('text', { x: padL - 6, y: padT + 8, 'text-anchor': 'end',
                                 fill: '#8b94a3', 'font-size': 10 }, fmtNum(maxV)));
    svg.append(svgNode('line', { x1: padL, y1: H - padB, x2: W - 10, y2: H - padB,
                                 stroke: '#2e333d', 'stroke-width': 1 }));
    const draw = (key, color, dash) => {
        const pts = series.map((s, i) => [padL + step * i, H - padB - innerH * (s[key] / maxV)]);
        svg.append(svgNode('polyline', {
            points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '),
            fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-dasharray': dash || 'none'
        }));
        pts.forEach((p, i) => {
            const c = svgNode('circle', { cx: p[0].toFixed(1), cy: p[1].toFixed(1),
                                          r: 2.5, fill: color });
            const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            tip.textContent = series[i].day + ' · PV ' + series[i].pv + ' · UV ' + series[i].uv;
            c.append(tip);
            svg.append(c);
        });
    };
    draw('pv', '#3d5a80', '');
    draw('uv', '#e0a458', '4 3');
    const labelEvery = Math.max(1, Math.ceil(n / 8));
    series.forEach((s, i) => {
        if (n <= 8 || i % labelEvery === 0 || i === n - 1) {
            svg.append(svgNode('text', { x: padL + step * i, y: H - 8, 'text-anchor': 'middle',
                                         fill: '#8b94a3', 'font-size': 10 }, s.day.slice(5)));
        }
    });
}

function renderBlogPosts(list) {
    const tbody = document.getElementById('blog-posts');
    tbody.replaceChildren();
    if (!list || !list.length) {
        const tr = el('tr');
        const td = el('td', 'sub', '窗口内没有文章访问记录');
        td.colSpan = 3;
        tr.append(td);
        tbody.append(tr);
        return;
    }
    for (const p of list) {
        const tr = el('tr', 'row');
        const td = el('td', 'q', shortPost(p.path));
        td.title = p.path;
        tr.append(td, el('td', '', String(p.pv)), el('td', '', String(p.uv)));
        tbody.append(tr);
    }
}

function renderBlogRefs(refs, devices) {
    const tbody = document.getElementById('blog-refs');
    tbody.replaceChildren();
    if (!refs || !refs.length) {
        const tr = el('tr');
        const td = el('td', 'sub', '直接访问 / 无 referrer');
        td.colSpan = 2;
        tr.append(td);
        tbody.append(tr);
    } else {
        for (const r of refs) {
            const tr = el('tr');
            tr.append(el('td', '', r.ref), el('td', '', String(r.pv)));
            tbody.append(tr);
        }
    }
    const names = { mobile: '手机', tablet: '平板', desktop: '桌面' };
    const dev = (devices || [])
        .map(d => (names[d.device] || d.device) + ' ' + Math.round(d.share * 100) + '%')
        .join(' · ');
    document.getElementById('blog-devices').textContent = dev ? '设备：' + dev : '';
}

async function loadBlog() {
    try {
        const data = await getJSON('/dashboard/blog?days=' + state.days);
        document.getElementById('blog-cards').replaceChildren(
            card('PV', fmtNum(data.pv), data.days + ' 天窗口'),
            card('UV', fmtNum(data.uv), '按天去重'),
            card('有访问的文章', fmtNum(data.top_posts.length), 'top 10 内'),
            card('可疑记录', fmtNum(data.flagged), '已剔除，仅计数',
                 data.flagged ? 'warn' : '')
        );
        renderBlogTrend(data.series);
        renderBlogPosts(data.top_posts);
        renderBlogRefs(data.refs, data.devices);
        document.getElementById('blog-meta').textContent =
            '来自博客前端 beacon：不存 IP / 完整 URL，UV 按天换盐、跨天无法串联同一人';
    } catch (e) {
        document.getElementById('blog-meta').textContent = '博客统计加载失败：' + e.message;
    }
}

function refreshAll() {
    document.getElementById('meta').textContent = '加载中…';
    loadSummary().catch(e => {
        document.getElementById('meta').textContent = '加载失败：' + e.message;
    });
    loadTurns(true);
    loadBlog();
    loadSystem();
}

document.querySelectorAll('[data-days]').forEach(btn => {
    btn.addEventListener('click', () => {
        state.days = Number(btn.dataset.days);
        document.querySelectorAll('[data-days]').forEach(b => b.classList.toggle('on', b === btn));
        refreshAll();
    });
});

document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
        state.filter = btn.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b === btn));
        loadTurns(true);
    });
});

document.getElementById('refresh').addEventListener('click', refreshAll);
document.getElementById('more').addEventListener('click', () => loadTurns(false));

// 图按容器宽度重绘（SVG 里的字号是绝对像素），窗口尺寸变一次就重取一次数据
let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        loadSummary().catch(() => {});
        loadBlog();
        loadSystem();
    }, 250);
});

refreshAll();
</script>
